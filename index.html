<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speakwell</title>
<meta name="description" content="English speaking and writing coach: presentations, meetings, office and social conversation, grammar and writing.">
<meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone = single column + bottom tab bar; unfolded Fold / tablet = left rail + content column */
:root{
  --paper:#F4F5F0; --surface:#FFFFFF; --sunk:#ECEEE7; --ink:#18212B; --muted:#5B6672; --line:#DCDFD6;
  --accent:#2B4EFF; --accent-ink:#FFFFFF; --accent-soft:#E3E8FF; --mark:#FFE15A; --mark-ink:#3A3100;
  --ok:#1F7A52; --ok-soft:#DDF2E7; --warn:#A86200; --warn-soft:#FCEBD2; --bad:#B8322F; --bad-soft:#F9DEDC;
  --subj:#D9F0D3; --subj-ink:#1E5A1A; --verb:#FBD9D6; --verb-ink:#8A1F17; --obj:#D6E6FB; --obj-ink:#173F7A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 0 rgba(24,33,43,.04), 0 6px 20px -12px rgba(24,33,43,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10151C; --surface:#17202A; --sunk:#1D2834; --ink:#E8ECF0; --muted:#9AA6B2; --line:#2A3542;
  --accent:#8299FF; --accent-ink:#0B1020; --accent-soft:#222C55; --mark:#E6C93A; --mark-ink:#241E00;
  --ok:#5CCB98; --ok-soft:#173528; --warn:#F0A945; --warn-soft:#3A2A12; --bad:#F07A74; --bad-soft:#3D1D1C;
  --subj:#1E3A1F; --subj-ink:#A8E3A0; --verb:#45201E; --verb-ink:#FFB4AC; --obj:#1B2F4C; --obj-ink:#A9C9FF;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#10151C; --surface:#17202A; --sunk:#1D2834; --ink:#E8ECF0; --muted:#9AA6B2; --line:#2A3542;
  --accent:#8299FF; --accent-ink:#0B1020; --accent-soft:#222C55; --mark:#E6C93A; --mark-ink:#241E00;
  --ok:#5CCB98; --ok-soft:#173528; --warn:#F0A945; --warn-soft:#3A2A12; --bad:#F07A74; --bad-soft:#3D1D1C;
  --subj:#1E3A1F; --subj-ink:#A8E3A0; --verb:#45201E; --verb-ink:#FFB4AC; --obj:#1B2F4C; --obj-ink:#A9C9FF;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
label.row{flex-wrap:nowrap;align-items:flex-start}
label.row input[type=checkbox]{margin-top:4px;flex:none;width:18px;height:18px}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
.main{min-width:0;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1680px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px 12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;flex:none}
.topbar .grow{flex:1 1 170px;min-width:0}
.topbar .eyebrow{line-height:1.3;margin-bottom:2px}
.status{display:inline-flex;align-items:center;gap:6px;font:500 .72rem var(--mono);padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--warn)}
.dot.err{background:var(--bad)}
button.status{cursor:pointer;color:var(--ink)}
.hitem summary{cursor:pointer;list-style:none;line-height:1.5}
.hitem summary::-webkit-details-marker{display:none}
.hbody{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
details summary{cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:500 .7rem var(--mono);letter-spacing:.03em;color:var(--muted);cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:760px){
  .app{grid-template-columns:220px 1fr}
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .rail .brand b{font:800 1.25rem var(--display);letter-spacing:-.02em}
  .rail button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:700}
  .rail button svg{width:22px;height:22px;flex:none}
  .rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail .spacer{flex:1}
  .main{padding-bottom:40px}
}

/* building blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.section > .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .t{font:700 1.05rem var(--display)}
.tile .d{color:var(--muted);font-size:.9rem}
.listrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px;cursor:pointer}
.listrow:last-child{border-bottom:0}
.listrow .grow{flex:1;min-width:0}
.listrow .t{font-weight:700}
.listrow .d{color:var(--muted);font-size:.86rem}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:99px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font:500 .78rem var(--mono);background:var(--sunk);color:var(--muted);border:1px solid transparent;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill{display:inline-block;white-space:nowrap;flex:none;padding:2px 9px;border-radius:99px;font:500 .72rem var(--mono)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
textarea{resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
label.f .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:700;z-index:50;max-width:90vw;text-align:center}

/* home */
.hero{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.hero{grid-template-columns:1.4fr 1fr}}
.hello h1 span{background:linear-gradient(transparent 62%, var(--mark) 62%);padding:0 .1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 1.5rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font:500 .7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plan .listrow .num{font:700 .8rem var(--mono);width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;flex:none}
.think-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.think-strip div{background:var(--sunk);border-radius:10px;padding:10px 8px;min-width:0}
.think-strip b{display:block;font:700 .92rem var(--display)}
.think-strip small{display:block;color:var(--muted);font-size:.72rem;line-height:1.3;margin-top:3px}
@media (max-width:520px){.think-strip{grid-template-columns:1fr}.think-strip div{display:flex;gap:10px;align-items:baseline}.think-strip b{min-width:56px}}

/* lesson */
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.points li{padding-left:18px;position:relative}
.points li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.points em{font-style:normal;background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:3px}
.fix{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--sunk)}
.fix .bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.fix .good{color:var(--ok);font-weight:700}
.q{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);padding:11px 13px;border-radius:10px;cursor:pointer}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{font-size:.9rem;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}

/* sentence builder */
.svo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.svo .col{border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.svo .col h3{font-size:.9rem;text-align:center;padding:4px 0}
.svo .s{background:var(--subj);color:var(--subj-ink)} .svo .v{background:var(--verb);color:var(--verb-ink)} .svo .o{background:var(--obj);color:var(--obj-ink)}
.svo button{border:0;background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 6px;cursor:pointer;font-size:.9rem;overflow-wrap:anywhere}
.svo button.on{outline:2px solid currentColor;font-weight:700}
.built{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:700 1.25rem var(--display);padding:14px;border-radius:12px;border:1px dashed var(--line);background:var(--surface)}
.built span{padding:4px 10px;border-radius:8px}
.built .s{background:var(--subj);color:var(--subj-ink)} .built .v{background:var(--verb);color:var(--verb-ink)} .built .o{background:var(--obj);color:var(--obj-ink)} .built .x{background:var(--sunk)}

/* speaking */
.phrase{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase p{flex:1;min-width:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);font:700 .78rem var(--mono);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;margin-top:1px}
.fw{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.fw div{border-top:3px solid var(--accent);background:var(--sunk);border-radius:0 0 10px 10px;padding:10px;min-width:0}
.fw b{font-family:var(--display)}
.fw small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.recorder{display:flex;flex-direction:column;gap:12px}
.mic{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.mic svg{width:30px;height:30px}
.mic.live{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.timer{font:700 2rem var(--mono);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--warn)} .timer.over{color:var(--bad)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.meter{background:var(--sunk);border-radius:10px;padding:10px}
.meter b{display:block;font:800 1.3rem var(--display);font-variant-numeric:tabular-nums}
.meter span{font:500 .68rem var(--mono);text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.feedback{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.feedback li{padding:8px 12px;border-radius:10px;font-size:.92rem}
.feedback .good{background:var(--ok-soft)} .feedback .tip{background:var(--warn-soft)} .feedback .info{background:var(--sunk)}
.ai-out{white-space:normal;line-height:1.6}
.ai-out p+p{margin-top:8px}
.ai-out ul{margin:6px 0;padding-left:20px}
.bigtopic{font:800 clamp(1.4rem,4vw,1.9rem)/1.2 var(--display);letter-spacing:-.01em}
.phase{font:500 .8rem var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:99px;display:inline-block}
.phase.think{background:var(--mark);color:var(--mark-ink)} .phase.speak{background:var(--bad-soft);color:var(--bad)} .phase.done{background:var(--ok-soft);color:var(--ok)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:.82rem;color:var(--muted);background:none;text-align:center}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--paper);padding:10px 0}
.composer textarea{min-height:46px;max-height:140px}
@media (min-width:760px){.composer{bottom:0}}

/* writing */
.editor{min-height:220px;font-size:1rem}
.issue{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.92rem}
.issue .k{font:500 .68rem var(--mono);text-transform:uppercase;color:var(--muted);flex:none;width:72px;padding-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair > div{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.pair b{font:700 1.1rem var(--display)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.spark{display:flex;align-items:flex-end;gap:4px;height:80px;padding-top:6px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.spark i:last-child{opacity:1}
.notice{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:.92rem}
.notice.info{background:var(--accent-soft)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.kbd{font:500 .8rem var(--mono);background:var(--sunk);padding:1px 6px;border-radius:5px}

/* sentence analysis */
:root{--r-subj:#2456C9;--r-verb:#B4231B;--r-obj:#9A5B12;--r-comp:#7A3DB8;--r-adv:#1F7A52;--r-mod:#5B6672}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--r-subj:#8FB0FF;--r-verb:#FF9A90;--r-obj:#E8B46A;--r-comp:#C9A2FF;--r-adv:#6FD3A6;--r-mod:#A7B2BE}}
:root[data-theme="dark"]{--r-subj:#8FB0FF;--r-verb:#FF9A90;--r-obj:#E8B46A;--r-comp:#C9A2FF;--r-adv:#6FD3A6;--r-mod:#A7B2BE}
.r-subject{color:var(--r-subj)} .r-verb{color:var(--r-verb)} .r-object,.r-prepositional-object,.r-indirect-object{color:var(--r-obj)}
.r-complement{color:var(--r-comp)} .r-adverbial{color:var(--r-adv)} .r-modifier,.r-conjunction,.r-clause{color:var(--r-mod)}
.selbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--accent-soft);min-width:0}
.selq{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
#anPanel{position:fixed;inset:0;z-index:60}
.an-scrim{position:absolute;inset:0;background:rgba(10,14,20,.35)}
.an-sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.an-sheet{left:auto;top:0;width:min(480px,100vw);max-height:none;border-radius:0;border-left:1px solid var(--line)}}
.an-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.an-head h2{font-size:1.1rem;flex:1}
.an-model{font:500 .72rem var(--mono);background:var(--sunk);padding:4px 9px;border-radius:99px;color:var(--muted)}
.an-body{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.an-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px}
.an-quote{font-size:1.05rem}
.an-wait{padding:4px 2px}
.dg{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px;font:400 1.08rem/1.35 Georgia,"Times New Roman",serif;color:var(--ink)}
.dg-plain{white-space:pre-wrap}
.dg-part{display:inline-flex;flex-direction:column;align-items:stretch;max-width:100%}
.dg-part .dg-txt{color:var(--ink);text-align:center;white-space:pre-wrap}
.dg-lab{font:700 .66rem/1.2 var(--body);text-align:center;white-space:nowrap;padding:0 2px}
.dg-br{height:7px;border:1.6px solid currentColor;margin:1px 1px}
.dg-part.up .dg-br{border-bottom:0}
.dg-part.down .dg-br{border-top:0}
.dg-part.up{align-self:flex-end;padding-bottom:22px} .dg-part.down{align-self:flex-start;padding-top:22px}
.an-role{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:.92rem;padding:3px 0}

@media (max-width:420px){.an-role{grid-template-columns:1fr;gap:0}}
.an-sec{display:flex;flex-direction:column;gap:8px}
.an-sec h3.eyebrow{font-size:.72rem}
.row.tight{gap:6px}
.an-tag{font:500 .76rem var(--mono);background:var(--sunk);padding:3px 9px;border-radius:99px}
.an-tag.bad{background:var(--bad-soft);color:var(--bad)}
.an-legend{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.tp{font:600 .84rem var(--body);padding:6px 12px;border-radius:99px;cursor:pointer;border:1px solid transparent;background:none;color:var(--ink)}
.tp:disabled{cursor:default}
.tp-present{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tp-attention{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tp-checked{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok);font-weight:500}
.tp-unused{border:1px dashed var(--line);color:var(--muted);font-weight:500}
.tp.sel{outline:2px solid var(--accent);outline-offset:1px}
.an-fix{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.an-fix .bad{color:var(--bad);text-decoration:line-through} .an-fix .good{color:var(--ok)}
.an-better{padding:12px;border-radius:10px;background:var(--ok-soft);display:flex;flex-direction:column;gap:8px}
.an-about summary{color:var(--muted);font-size:.9rem;margin-top:4px}
body.an-open{overflow:hidden}
#anPanel.inline{position:static;inset:auto;z-index:auto;margin-top:16px;scroll-margin-top:calc(12px + env(safe-area-inset-top,0px))}
#anPanel.inline .an-scrim{display:none}
#anPanel.inline .an-sheet{position:static;inset:auto;width:auto;max-height:none;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);background:var(--paper);padding-bottom:0}
#anPanel.inline .an-head{padding:14px 16px 12px}
#anPanel.inline .an-body{overflow:visible;padding:14px 16px 18px}

/* notes */
.note{display:flex;flex-direction:column;gap:12px}
.nm-grid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.nm-grid{grid-template-columns:1fr 1fr}}
.nm-box{border-radius:10px;padding:12px;min-width:0;line-height:1.6;overflow-wrap:anywhere}
.nm-box p{margin-top:4px}
.nm-wrong{background:var(--bad-soft)} .nm-right{background:var(--ok-soft)}
del.nm-del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;background:color-mix(in srgb,var(--bad) 14%,transparent);border-radius:3px;padding:0 2px}
ins.nm-ins{color:var(--ok);text-decoration:none;font-weight:700;background:color-mix(in srgb,var(--ok) 18%,transparent);border-radius:3px;padding:0 2px}
.nm-fixes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}

/* notes list + detail */
.main.wide-main{max-width:1680px}
.nwrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;min-height:70vh}
.nl{display:flex;flex-direction:column;gap:10px;padding:14px;min-width:0;background:var(--surface)}
.nwrap .nl{border-right:1px solid var(--line);max-height:calc(100vh - 150px);position:sticky;top:0;overflow:hidden}
.nl-head{display:flex;align-items:center;justify-content:space-between}
.nl-head .icon-btn{font-size:1.3rem;line-height:1}
.nl-items{display:flex;flex-direction:column;overflow-y:auto;margin:0 -14px;border-top:1px solid var(--line)}
.nl-item{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:none;padding:12px 14px;cursor:pointer;color:var(--ink);min-width:0}
.nl-item b{font-family:var(--display);font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl-item.on{background:var(--accent-soft);border-left-color:var(--accent)}
.nl-prev{color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl-meta{font-size:.78rem;color:var(--muted)}
.nl-tags{display:flex;flex-wrap:wrap;gap:6px}
.nl-tags i{font-style:normal;font:500 .74rem var(--mono);color:var(--accent)}
.nd{display:flex;flex-direction:column;gap:14px;padding:18px;min-width:0}
.nd-title{font:800 1.4rem var(--display);border:0;background:transparent;padding:4px 0;min-height:0;border-bottom:1px dashed transparent;border-radius:0}
.nd-title:hover,.nd-title:focus{border-bottom-color:var(--line);outline:none}
.nd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nd-stats div{background:var(--sunk);border-radius:10px;padding:10px}
.nd-stats b{display:block;font:800 1.3rem var(--display);font-variant-numeric:tabular-nums}
.nd-stats span{font:500 .68rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.np{display:flex;flex-direction:column;gap:12px}
.np-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;align-items:start}
.np-row > .nm-fixes{grid-column:2}
.np-n{font:700 .78rem var(--mono);width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;margin-top:8px;color:var(--muted)}
.np-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0;position:relative}
.np-pair .nm-box{padding:10px 12px}
.np-reveal{grid-column:2;justify-self:start;align-self:center}
@media (max-width:560px){.np-pair{grid-template-columns:1fr}.np-reveal{grid-column:1}}
.np-row.same .np-same{padding:8px 4px;color:var(--muted);line-height:1.6}
@media (max-width:899px){.nl{padding:0;background:transparent}.nl-items{margin:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}.nl-items .nl-item:last-child{border-bottom:0}.nd{padding:0}}

/* wide layouts: use the whole screen */
@media (min-width:1100px){.main{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.cols{display:grid;gap:22px 26px;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));align-items:start;margin-top:22px}
.cols > .section{margin-top:0}
.split{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
.col-main,.col-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.col-main > .section,.col-side > .section{margin-top:0}
@media (min-width:1100px){
  .split{grid-template-columns:minmax(0,1.55fr) minmax(360px,1fr);gap:28px}
  .col-side.stick{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
  .col-main .editor{min-height:440px}
}
@media (min-width:1500px){.split{grid-template-columns:minmax(0,1.7fr) minmax(420px,1fr)}}
.guide-list .listrow{padding:10px 2px}
.rail-count{margin-left:auto;font:500 .72rem var(--mono);color:var(--muted)}
.hero{align-items:start}
.resume{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.resume .tile .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* titles, tags, links */
.doc-title{font:700 1.25rem var(--display);border:1px solid transparent;background:transparent;padding:4px 6px;margin-left:-6px;min-height:0;border-radius:8px}
.doc-title:hover{border-color:var(--line)} .doc-title:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.doc-title::placeholder{color:var(--muted);font-weight:500}
.nd-titlewrap{display:flex;align-items:center;gap:6px;margin-top:-6px}

.nd-titlewrap svg{width:16px;height:16px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border:1px dashed var(--line);border-radius:10px;min-height:40px;cursor:text}
.tagbox:focus-within{border-style:solid;border-color:var(--accent)}
.tagchip{display:inline-flex;align-items:center;gap:2px;font:500 .8rem var(--mono);background:var(--accent-soft);color:var(--accent);padding:3px 4px 3px 9px;border-radius:99px}

.taginput{border:0!important;background:transparent!important;min-height:28px!important;padding:2px 4px!important;flex:1;min-width:140px;width:auto!important;font:500 .85rem var(--mono)}
.taginput:focus{outline:none}
.nl-tags i.u{color:var(--ink);font-weight:700}
.links-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linkchip{display:inline-flex;align-items:center;gap:2px;background:var(--sunk);border-radius:99px;padding:3px 4px 3px 10px;font-size:.85rem;max-width:100%}
.linkchip a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkchip.gone{opacity:.55} .linkchip.gone a{text-decoration:line-through}
.linkchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:0 5px}
a.nlink{color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-weight:700}
.lmenu{position:fixed;z-index:80;width:min(360px,calc(100vw - 16px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:12px;display:flex;flex-direction:column;gap:8px}
.lmenu input{min-height:36px;padding:7px 10px}

/* attachments + sharing */
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.dropzone.drag,.card.drag,.nd.drag .dropzone{border-color:var(--accent);background:var(--accent-soft)}
.card.drag{outline:2px dashed var(--accent);outline-offset:2px}
.att-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.att{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att:last-child{border-bottom:0}
.att-ic svg{width:20px;height:20px;color:var(--muted)}
.att-name{flex:1;min-width:140px;font-weight:700;overflow-wrap:anywhere}
.share-panel{display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.share-panel a.btn{text-decoration:none;color:var(--ink)}
a.nlink.inner{text-decoration-style:dashed}
.linkchip.inner{background:var(--accent-soft)}
.rail .rail-install{color:var(--accent)}
#instHelp{margin-bottom:18px;border-color:var(--accent)}
.doc-head{flex:1 1 320px;min-width:0}
.doc-head .doc-title{width:100%}

/* notes list inside the side menu */
.rail-notes{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1 1 auto;margin:2px 0 6px 14px;padding-left:10px;border-left:2px solid var(--line)}
.rail-notes + .spacer{flex:0 0 8px}
.rn-tools{display:flex;gap:6px;align-items:center}
.rn-tools input{min-height:32px;padding:5px 9px;font-size:.85rem;border-radius:8px}
.rn-tools .icon-btn{width:30px;height:30px;font-size:1.1rem;flex:none}
.rn-chips{display:flex;flex-wrap:wrap;gap:4px}
.rail .rn-chip{display:inline-flex;padding:2px 8px;border-radius:99px;font:500 .7rem var(--mono);background:var(--sunk);color:var(--muted);border:1px solid transparent;cursor:pointer;gap:0}
.rail .rn-chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.rn-list{display:flex;flex-direction:column;overflow-y:auto;min-height:0;gap:1px}
.rail .rn-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;font-weight:500;font-size:.88rem;color:var(--ink);text-align:left;width:100%}
.rail .rn-item.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rn-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.nwrap.solo{display:block;min-height:0}
.nwrap.solo .nd{max-width:none}
</style>
